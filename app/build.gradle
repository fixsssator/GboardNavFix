plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.gboardnavfix'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.gboardnavfix"
        minSdk 27
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Xposed / LSPosed API — compileOnly, it's provided by the LSPosed framework at runtime
    compileOnly 'de.robv.android.xposed:api:82'
}
